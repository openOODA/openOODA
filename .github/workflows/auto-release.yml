name: auto-release

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Pattern of artifact names to download and attach (e.g. release-assets-*)'
        required: false
        type: string
        default: ''
      target_tag:
        description: 'Specific release tag to target or rebuild (e.g. v0.2.12). If omitted, auto-increments patch version.'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      artifact_pattern:
        description: 'Pattern of artifact names to download and attach (e.g. release-assets-*)'
        required: false
        type: string
        default: ''
      target_tag:
        description: 'Specific release tag to target or rebuild (e.g. v0.2.12)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next tag and release notes
        id: prep
        run: |
          set -e
          TARGET_TAG="${{ inputs.target_tag }}"
          TAG_EXISTS="false"
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          [ -z "$LAST_TAG" ] && LAST_TAG="v0.0.0"

          if [ -n "$TARGET_TAG" ]; then
            if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: TARGET_TAG='$TARGET_TAG' is malformed (must match vMAJOR.MINOR.PATCH)"
              exit 1
            fi
            NEW_TAG="$TARGET_TAG"
            if git rev-parse -q --verify "refs/tags/${TARGET_TAG}" >/dev/null; then
              TAG_EXISTS="true"
              echo "Target tag $TARGET_TAG already exists in git."
            fi
          else
            LAST_NUM=${LAST_TAG#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$LAST_NUM"
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

            while git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; do
              echo "Tag $NEW_TAG already exists, incrementing patch..."
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            done

            if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: NEW_TAG='$NEW_TAG' is malformed (inherited from LAST_TAG='$LAST_TAG')"
              echo "Aborting to prevent ghost tag creation."
              exit 1
            fi
          fi

          if [ "$TAG_EXISTS" = "true" ]; then
            NOTES="- update release assets for ${NEW_TAG}"
          elif [ "$LAST_TAG" = "v0.0.0" ]; then
            NOTES=$(git log --pretty=format:"- %s" | head -50)
          else
            NOTES=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" | head -50)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- update from $(git rev-parse --short HEAD)"
          fi

          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "${NOTES}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Download assets FIRST before pushing any remote tags
      - name: Download release assets
        if: ${{ inputs.artifact_pattern != '' && inputs.artifact_pattern != null }}
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
          path: dist/

      # Validate assets exist and are flat files
      - name: Validate release assets
        if: ${{ inputs.artifact_pattern != '' && inputs.artifact_pattern != null }}
        run: |
          set -euo pipefail
          test -d dist || { echo "ERROR: dist/ directory missing"; exit 1; }
          count=$(find dist/ -maxdepth 1 -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: No release binary files found in dist/"
            exit 1
          fi
          echo "Validated $count asset(s) ready for release:"
          ls -lh dist/

      # Create and push tag only after assets are verified and if tag is new
      - name: Create and push tag
        if: ${{ steps.prep.outputs.tag_exists != 'true' }}
        run: |
          set -e
          git config user.name "openOODA Auto-Release"
          git config user.email "ops@openooda.org"
          git tag "${{ steps.prep.outputs.new_tag }}"
          git push origin "${{ steps.prep.outputs.new_tag }}"

      # Publish release with binary assets attached
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.new_tag }}
          name: ${{ steps.prep.outputs.new_tag }}
          body: ${{ steps.prep.outputs.notes }}
          generate_release_notes: false
          files: ${{ (inputs.artifact_pattern != '' && inputs.artifact_pattern != null) && 'dist/*' || '' }}
          fail_on_unmatched_files: ${{ (inputs.artifact_pattern != '' && inputs.artifact_pattern != null) }}
