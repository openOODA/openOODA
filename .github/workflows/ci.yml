name: Standard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Forbid leftover .md files (BOOTSTRAP global ban)
      run: |
        set -euo pipefail
        leftovers=$(find . -name '*.md' -not -path './.git/*' | sort || true)
        if [[ -n "$leftovers" ]]; then
          echo "forbidden .md files present:" >&2
          echo "$leftovers" >&2
          exit 1
        fi
        echo "OK: no .md files"

    - name: Run checks
      run: echo "Replace with actual build/test commands"
