name: openOODA CI

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v2.11.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout openOODA
        uses: actions/checkout@v4
        with:
          path: openOODA
      - name: require governance tree
        working-directory: ${{ github.workspace }}/openOODA
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f README.md
          test -f VERSION
          test -f .gitattributes
          test -f .gitignore
          test -d cards
          # Constitutional root: canonical 8-entry blueprint + VERSION + cards/ = exactly 10 entries
          # (generated bin/ and dist/ are gitignored build artifacts, not constitutional entries).
          n=$(find . -maxdepth 1 -mindepth 1 ! -name '.*' ! -name 'bin' ! -name 'dist' | wc -l)
          test "$n" -eq 10 || { echo "ERR root entries=$n != 10"; exit 1; }
          for e in AGENTS.md README.md VERSION Makefile ooda.pkg anchor.oo cards cli core tests; do
            test -e "$e" || { echo "ERR missing constitutional root entry $e"; exit 1; }
          done
          # Exactly the 8 canonical Quick Cards, zero-bloat (~24-line) shape.
          test "$(ls cards/*.md | wc -l)" -eq 8
          for c in ooda layers spec rules ui security privacy defense; do
            f="cards/$c.md"
            test -f "$f" || { echo "ERR missing $f"; exit 1; }
            l=$(wc -l < "$f")
            test "$l" -ge 8 -a "$l" -le 64 || { echo "ERR $f lines=$l outside 8..64"; exit 1; }
            grep -q "cards/$c.md" README.md || { echo "ERR $f not linked in README"; exit 1; }
          done
          # Linguist wiring: .oo/.oot resolve to the OODA language.
          grep -q 'linguist-language=OODA' .gitattributes || { echo "ERR .gitattributes missing OODA mapping"; exit 1; }
          # The canonical card ships the mandatory oostd reuse law.
          grep -q 'Always import `oostd`' AGENTS.md || { echo "ERR AGENTS.md missing oostd reuse law"; exit 1; }
          echo "[governance OK] 8 quick cards, 8-entry root, linguist + oostd laws wired"

  auto-release:
    needs: [verify]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
