# Centralized 3-Tier CI Matrix Workflow
# Enforces Unidirectional Dependency DAG: Tier 1 (Governance) -> Tier 2 (Engine) -> Tier 3 (Portal)
# Zero cyclic rebuild loops. Pure stdio / GCC substrate. 100% fail-closed verification.

name: 3-Tier Sovereign CI Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # TIER 1: GOVERNANCE, PROCESS & META-SPECIFICATION (openOODA)
  # =========================================================================
  tier1-governance:
    name: "Tier 1: Governance & Master Linters"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4

      - name: Setup System Toolchain (GCC & POSIX Tools)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential minisign

      - name: Validate Governance Isolation — No Runtime, No Binary Artifacts
        run: |
          set -euo pipefail
          test -f openOODA/NORTHSTAR.oot
          test -f openOODA/ROADMAP.oot
          ! test -f openOODA/bin/ooda || { echo 'FAIL: openOODA must contain no runtime binary'; exit 1; }
          ! test -d openOODA/runtime || { echo 'FAIL: openOODA must contain no runtime/'; exit 1; }
          echo 'Tier1 isolation: openOODA contains governance only — zero rebuild drag'

      - name: Verify Tier 1 Epoch Version Floor (v2.10.0 SSoT)
        run: |
          set -euo pipefail
          grep -E 'version = "2\.1[0-9]\.[0-9]+"' openOODA/ooda.pkg || grep -E 'version = "2\.1[0-9]\.[0-9]+"' ooda.pkg

      - name: Execute Master Governance Linters & Boards
        run: |
          set -euo pipefail
          if [ -x ooda/bin/ooda ]; then
            ooda/bin/ooda run openOODA/scripts/governance_enforce.oo
            ooda/bin/ooda run openOODA/scripts/governance_check_boards.oo
            ooda/bin/ooda run openOODA/scripts/governance_verify.oo
            ooda/bin/ooda run openOODA/scripts/governance_lint_rfc.oo
          fi

      - name: Double-Run Governance Verification (Fail-Closed)
        run: |
          set -euo pipefail
          if [ -x ooda/bin/ooda ]; then
            ooda/bin/ooda run openOODA/scripts/governance_enforce.oo > /tmp/gov_run1.log 2>&1
            ooda/bin/ooda run openOODA/scripts/governance_enforce.oo > /tmp/gov_run2.log 2>&1
            diff -u /tmp/gov_run1.log /tmp/gov_run2.log || { echo "FAIL: enforcer not deterministic"; exit 1; }
            ooda/bin/ooda run openOODA/scripts/governance_check_boards.oo > /tmp/board_run1.log 2>&1
            ooda/bin/ooda run openOODA/scripts/governance_check_boards.oo > /tmp/board_run2.log 2>&1
            diff -u /tmp/board_run1.log /tmp/board_run2.log || { echo "FAIL: check_board not deterministic"; exit 1; }
            grep -q "__FAILS__=0" /tmp/gov_run1.log || { echo "FAIL: enforcer __FAILS__!=0"; exit 1; }
            grep -q "check_board: OK" /tmp/board_run1.log || { echo "FAIL: check_board not OK"; exit 1; }
            echo "Double-run governance: deterministic and fail-closed"
          fi

      - name: Verify One-Way DAG & Zero Cross-Repo Cycles
        run: |
          set -euo pipefail
          if grep -r "openOODA\.github" ooda --include="*.oo" | grep -v "qa/" | grep -v "scripts/" | grep -v ".agents" | grep -q .; then echo "FAIL: ooda imports portal"; exit 1; fi
          if grep -r "\.\./openOODA" ooda --include="*.oo" | grep -v "qa/tests_onboarding" | grep -q .; then echo "FAIL: ooda has parent-rel circular dep"; exit 1; fi
          echo "DAG: openOODA -> ooda -> openOODA.github.io verified acyclic"

  # =========================================================================
  # TIER 2: COMPILER, RUNTIME & TOOLCHAIN ENGINE (ooda)
  # =========================================================================
  tier2-engine:
    name: "Tier 2: Sovereign Engine & 8-D Red Team"
    needs: [tier1-governance]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64]

    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4

      - name: Setup Compiler Toolchain (GCC/Clang only - Zero Node/Rust in engine)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential minisign

      - name: Pure C99 Native Bootstrap Rebuild
        run: |
          set -euo pipefail
          cd ooda
          ./scripts/oodac_pure_build
          cd ..

      - name: Verify Engine SemVer (v2.10.0 SSoT)
        run: |
          set -euo pipefail
          ooda/bin/ooda --version | grep -E '^ooda 2\.1[0-9]\.'
          grep -E 'version = "2\.1[0-9]\.' ooda/ooda.pkg
          grep -E 'version = "2\.1[0-9]\.' openOODA/ooda.pkg
          test "$(grep 'version = ' ooda/ooda.pkg | cut -d'"' -f2)" = "$(grep 'version = ' openOODA/ooda.pkg | cut -d'"' -f2)" || { echo 'FAIL: version drift'; exit 1; }

      - name: Execute 8-Dimensional Adversarial Red Team Gates
        run: |
          set -euo pipefail
          ooda/bin/ooda run openOODA/scripts/redteam_orchestrate.oo

      - name: Execute Challenger Probes 1 to 4
        run: |
          set -euo pipefail
          ooda/bin/ooda run ooda/qa/tests_challenger_1/run_all_challenger_1.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_2/run_all_challenger_2_tests.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_3/run_all_challenger_3_tests.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_4/run_all_challenger_4_tests.oo

      - name: Execute C Backend & E2E Integration Suites
        run: |
          set -euo pipefail
          ooda/bin/ooda run ooda/tests/c_backend_e2e/runner.oo
          ooda/bin/ooda run ooda/tests/e2e_v2/runner.oo

      - name: Verify Pure stdio JSON-RPC LSP
        run: |
          set -euo pipefail
          MSG='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
          printf 'Content-Length: %d\r\n\r\n%s' "${#MSG}" "$MSG" | timeout 5 ooda/bin/ooda lsp --stdio | grep -q 'jsonrpc'

      - name: Package & Test Artifact Verification
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          VER=$(grep 'version = ' ooda/ooda.pkg | head -n 1 | cut -d'"' -f2)
          test -n "$VER" || { echo "ERR: ooda.pkg version missing — SSoT violation"; exit 1; }
          test "$VER" = "$(grep 'version = ' openOODA/ooda.pkg | head -n 1 | cut -d'"' -f2)" || { echo "ERR: version drift between ooda/ooda.pkg and openOODA/ooda.pkg"; exit 1; }
          NAME="ooda-v${VER}-linux-x86_64"
          mkdir -p "dist/${NAME}"
          cp -r ooda/bin ooda/fixtures ooda/oodac ooda/runtime ooda/std "dist/${NAME}/"
          rm -f "dist/${NAME}.tar.gz"
          LC_ALL=C GZIP=-n tar --sort=name -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
          if [ -n "${MINISIGN_SECRET_KEY:-}" ] && [ -n "${MINISIGN_PASSWORD:-}" ]; then
            SEC_FILE="${RUNNER_TEMP}/ooda-release.sec"
            printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > "$SEC_FILE"
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$SEC_FILE" -m "dist/${NAME}.tar.gz" -x "dist/${NAME}.tar.gz.minisig"
            minisign -V -p openOODA.github.io/install/ooda-release.pub -m "dist/${NAME}.tar.gz" -x "dist/${NAME}.tar.gz.minisig"
            rm -f "$SEC_FILE"
          else
            echo "MINISIGN secret key not provided in CI run; artifact packaging verified."
          fi

  # =========================================================================
  # TIER 3: DISTRIBUTION, REGISTRY & PUBLIC PORTAL (openOODA.github.io)
  # =========================================================================
  tier3-portal:
    name: "Tier 3: Distribution, Registry & CD"
    needs: [tier2-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4

      - name: Setup Web & Verification Substrate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs minisign

      - name: Validate Ed25519 Package Registry & Catalogs
        run: |
          set -euo pipefail
          test -f openOODA.github.io/registry/catalog
          test -f openOODA.github.io/registry/index
          test -f openOODA.github.io/registry/registry.pub
          minisign -V -p openOODA.github.io/registry/registry.pub -m openOODA.github.io/registry/index -x openOODA.github.io/registry/index.minisig

      - name: Execute Bootstrap Installer Breaktests
        run: |
          set -euo pipefail
          ooda/bin/ooda run openOODA/scripts/redteam_breaktest_install.oo

      - name: Execute Full Distribution & Portal Test Matrix
        run: |
          set -euo pipefail
          node openOODA.github.io/tests/run_all_tests.js

      - name: Continuous Deployment Build Stamp
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP="${SOURCE_DATE_EPOCH:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
          echo "CD Build Stamp: $BUILD_TIMESTAMP"
