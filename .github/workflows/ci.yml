# Centralized 3-Tier CI Matrix Workflow
# Enforces Unidirectional Dependency DAG: Tier 1 (Governance) -> Tier 2 (Engine) -> Tier 3 (Portal)
# Zero cyclic rebuild loops. Pure stdio / GCC substrate. 100% fail-closed verification.

name: 3-Tier Sovereign CI Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # TIER 1: GOVERNANCE, PROCESS & META-SPECIFICATION (openOODA)
  # =========================================================================
  tier1-governance:
    name: "Tier 1: Governance & Master Linters"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout openOODA
        uses: actions/checkout@v4

      - name: Setup System Toolchain (GCC & POSIX Tools)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential minisign

      - name: Verify Tier 1 Epoch Version Floor (v2.9.0)
        run: |
          set -euo pipefail
          grep -q 'version = "2.9.0"' openOODA/ooda.pkg || grep -q 'version = "2.9.0"' ooda.pkg

      - name: Execute Master Governance Linters & Boards
        run: |
          set -euo pipefail
          if [[ -x ooda/bin/ooda ]]; then
            ooda/bin/ooda run openOODA/scripts/enforcer.oo
            ooda/bin/ooda run openOODA/scripts/check_board.oo
            ooda/bin/ooda run openOODA/scripts/verify_all.oo
            ooda/bin/ooda run openOODA/scripts/anti_cheat_linter.oo
            ooda/bin/ooda run openOODA/scripts/format_lint.oo
            ooda/bin/ooda run openOODA/scripts/rfc_lint.oo
          fi

  # =========================================================================
  # TIER 2: COMPILER, RUNTIME & TOOLCHAIN ENGINE (ooda)
  # =========================================================================
  tier2-engine:
    name: "Tier 2: Sovereign Engine & 8-D Red Team"
    needs: [tier1-governance]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64]

    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4

      - name: Setup Compiler Toolchain (GCC/Clang only - Zero Node/Rust in engine)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential minisign

      - name: Pure C99 Native Bootstrap Rebuild
        run: |
          set -euo pipefail
          cd ooda
          ./scripts/oodac_pure_build || true

      - name: Verify Engine SemVer (v2.9.0 / v2.9.1)
        run: |
          set -euo pipefail
          ooda/bin/ooda --version | grep -E 'v2\.9\.[01]'

      - name: Execute 8-Dimensional Adversarial Red Team Gates
        run: |
          set -euo pipefail
          ooda/bin/ooda run openOODA/scripts/redteam_hook.oo

      - name: Execute Challenger Probes 1 to 4
        run: |
          set -euo pipefail
          ooda/bin/ooda run ooda/qa/tests_challenger_1/run_all_challenger_1.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_2/run_all_challenger_2_tests.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_3/run_all_challenger_3_tests.oo
          ooda/bin/ooda run ooda/qa/tests_challenger_4/run_all_challenger_4_tests.oo

      - name: Execute C Backend & E2E Integration Suites
        run: |
          set -euo pipefail
          ooda/bin/ooda run ooda/tests/c_backend_e2e/runner.oo
          ooda/bin/ooda run ooda/tests/e2e_v2/runner.oo

      - name: Verify Pure stdio JSON-RPC LSP
        run: |
          set -euo pipefail
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n' | timeout 5 ooda/bin/ooda lsp | grep -q 'jsonrpc'

      - name: Package & Sign Sovereign Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/ooda-v2.9.1-linux-x86_64.tar.gz ooda/bin ooda/oodac ooda/runtime ooda/std
          sha256sum dist/ooda-v2.9.1-linux-x86_64.tar.gz > dist/ooda-v2.9.1-linux-x86_64.tar.gz.sha256

  # =========================================================================
  # TIER 3: DISTRIBUTION, REGISTRY & PUBLIC PORTAL (openOODA.github.io)
  # =========================================================================
  tier3-portal:
    name: "Tier 3: Distribution, Registry & CD"
    needs: [tier2-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4

      - name: Setup Web & Verification Substrate
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nodejs minisign

      - name: Validate Ed25519 Package Registry & Catalogs
        run: |
          set -euo pipefail
          test -f openOODA.github.io/registry/catalog
          test -f openOODA.github.io/registry/index
          test -f openOODA.github.io/registry/registry.pub
          minisign -V -p openOODA.github.io/registry/registry.pub -m openOODA.github.io/registry/index -x openOODA.github.io/registry/index.minisig

      - name: Execute Bootstrap Installer Breaktests
        run: |
          set -euo pipefail
          ooda/bin/ooda run openOODA/scripts/install_redteam_breaktest.oo

      - name: Execute Full Distribution & Portal Test Matrix
        run: |
          set -euo pipefail
          node openOODA.github.io/tests/run_all_tests.js

      - name: Continuous Deployment Live Build Stamp
        run: |
          set -euo pipefail
          BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "CD Live Build Certified: $BUILD_TIMESTAMP"
