name: openOODA CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v2.12.2)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.gov.outputs.version_tag }}
    steps:
      - name: checkout openOODA
        uses: actions/checkout@v4
        with:
          path: openOODA
      - name: require governance tree
        id: gov
        working-directory: ${{ github.workspace }}/openOODA
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f README.md
          test -f VERSION
          test -f .gitattributes
          test -f .gitignore
          test -d cards
          # Constitutional root: canonical 8-entry blueprint + VERSION + cards/ = exactly 10 entries
          # (generated bin/ and dist/ are gitignored build artifacts, not constitutional entries).
          n=$(find . -maxdepth 1 -mindepth 1 ! -name '.*' ! -name 'bin' ! -name 'dist' | wc -l)
          test "$n" -eq 10 || { echo "ERR root entries=$n != 10"; exit 1; }
          for e in AGENTS.md README.md VERSION Makefile ooda.pkg anchor.oo cards cli core tests; do
            test -e "$e" || { echo "ERR missing constitutional root entry $e"; exit 1; }
          done
          # Exactly the 8 canonical Quick Cards, zero-bloat (~24-line) shape.
          test "$(ls cards/*.md | wc -l)" -eq 8
          for c in ooda layers spec rules ui security privacy defense; do
            f="cards/$c.md"
            test -f "$f" || { echo "ERR missing $f"; exit 1; }
            l=$(wc -l < "$f")
            test "$l" -ge 8 -a "$l" -le 64 || { echo "ERR $f lines=$l outside 8..64"; exit 1; }
            grep -q "cards/$c.md" README.md || { echo "ERR $f not linked in README"; exit 1; }
          done
          # Linguist wiring: .oo/.oot resolve to the OODA language.
          grep -q 'linguist-language=OODA' .gitattributes || { echo "ERR .gitattributes missing OODA mapping"; exit 1; }
          # The canonical card ships the mandatory oostd reuse law.
          grep -q 'Always import `oostd`' AGENTS.md || { echo "ERR AGENTS.md missing oostd reuse law"; exit 1; }
          echo "version_tag=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "[governance OK] 8 quick cards, 8-entry root, linguist + oostd laws wired"

  integration:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: checkout openOODA
        uses: actions/checkout@v4
        with:
          path: openOODA
      - name: install standalone @core toolchain from openOODA/install@hub
        run: |
          set -euo pipefail
          command -v clang >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y clang)
          mkdir -p "$HOME/.openooda/bin" "$HOME/.openooda/cards" "$HOME/.openooda/oostd" /tmp/oo-hub
          hub="https://github.com/openOODA/install/releases/download/hub"
          curl -fsSL "$hub/SHA256SUMS" -o /tmp/oo-hub/SHA256SUMS
          for f in oodac-linux-x86_64 liboodar.a oohat-linux-x86_64 oostd-linux-x86_64.tar.gz cap_table.oot; do
            curl -fsSL "$hub/$f" -o "/tmp/oo-hub/$f"
            grep -E "  $f\$" /tmp/oo-hub/SHA256SUMS | (cd /tmp/oo-hub && sha256sum -c -)
          done
          cp -f /tmp/oo-hub/oodac-linux-x86_64 "$HOME/.openooda/bin/oodac"
          cp -f /tmp/oo-hub/oohat-linux-x86_64 "$HOME/.openooda/bin/oohat"
          cp -f /tmp/oo-hub/liboodar.a "$HOME/.openooda/bin/liboodar.a"
          cp -f /tmp/oo-hub/cap_table.oot "$HOME/.openooda/cards/cap_table.oot"
          cp -f "${{ github.workspace }}/openOODA/AGENTS.md" "$HOME/.openooda/AGENTS.md"
          cp -f "${{ github.workspace }}"/openOODA/cards/*.md "$HOME/.openooda/cards/"
          chmod +x "$HOME/.openooda/bin/oodac" "$HOME/.openooda/bin/oohat"
          tar -xzf /tmp/oo-hub/oostd-linux-x86_64.tar.gz -C "$HOME/.openooda/oostd"
          test -f "$HOME/.openooda/oostd/core/anchor.oo"
          rm -rf /tmp/oo-hub
      - name: build, verify, and run standalone test suites
        working-directory: ${{ github.workspace }}/openOODA
        run: |
          set -euo pipefail
          make build verify test
          OODA_FS_READDIR="$PWD:$HOME/.openooda" "$HOME/.openooda/bin/oohat" cycle . --json | tee /tmp/oohat.json
          grep -q '"quorum_mask":255' /tmp/oohat.json
          mkdir -p dist
          cp -f bin/openooda dist/openooda-linux-x86_64
          (cd dist && sha256sum openooda-linux-x86_64 > openooda-linux-x86_64.sha256)
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: openOODA/dist/*

  auto-release:
    needs: [verify, integration]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/auto-release.yml
    with:
      artifact_pattern: release-assets-*
      target_tag: ${{ inputs.target_tag || needs.verify.outputs.version_tag }}
