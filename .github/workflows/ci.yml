name: openOODA CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v2.11.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout openOODA
        uses: actions/checkout@v4
        with:
          path: openOODA
      - name: checkout oodac (prebuilt compiler)
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar (Gen 1 C host, for the std/fs/net/secrets bindings)
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          set -euo pipefail
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: run governance verifiers (RULES §1.8/§1.11/§1.14/§1.19)
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo '=== governance_enforce.oo ==='
          "$OODA_COMPILER" run openOODA/scripts/governance_enforce.oo
          echo '=== governance_check_boards.oo ==='
          "$OODA_COMPILER" run openOODA/scripts/governance_check_boards.oo
          echo '=== governance_verify.oo ==='
          "$OODA_COMPILER" run openOODA/scripts/governance_verify.oo
          echo '=== redteam_orchestrate.oo ==='
          "$OODA_COMPILER" run openOODA/scripts/redteam_orchestrate.oo
      - name: run moonshot scorecard proof (NORTHSTAR 8th line)
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo '=== proof_of_today.oo ==='
          "$OODA_COMPILER" run openOODA/scripts/proof_of_today.oo
