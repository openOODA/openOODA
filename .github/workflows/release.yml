# Sovereign Release Packaging, Minisign Signing & GitHub Deployment Workflow
# Triggered on release tag push 'v*' or manual workflow dispatch.
# Packages bin/, fixtures/, oodac/, runtime/, std/ into deterministic distribution archives.
# Signs tarballs with Minisign Ed25519 and publishes releases to GitHub with signed assets.

name: Sovereign Release Packaging & Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v2.10.0)'
        required: true
        default: 'v2.10.0'

permissions:
  contents: write

jobs:
  release:
    name: "Package, Sign & Publish Sovereign Release"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout openOODA Ecosystem
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Compiler & Security Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential minisign

      - name: Verify Sovereign Substrate Invariants
        run: |
          set -euo pipefail
          cd ooda
          ./scripts/oodac_pure_build
          cd ..
          ooda/bin/ooda run openOODA/scripts/enforcer.oo
          ooda/bin/ooda run openOODA/scripts/check_board.oo
          ooda/bin/ooda run openOODA/scripts/verify_all.oo
          ooda/bin/ooda run openOODA/scripts/redteam_hook.oo

      - name: Package Distribution Archive
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VER="${TAG#v}"
          if [ -z "$VER" ]; then
            VER=$(grep 'version = ' ooda/ooda.pkg | head -n 1 | cut -d'"' -f2)
          test -n "$VER" || { echo "ERR: version missing for release packaging"; exit 1; }
          fi
          NAME="ooda-v${VER}-linux-x86_64"
          echo "PACKAGING_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VER}" >> "$GITHUB_ENV"
          mkdir -p "dist/${NAME}"
          cp -r ooda/bin ooda/fixtures ooda/oodac ooda/runtime ooda/std "dist/${NAME}/"
          rm -f "dist/${NAME}.tar.gz"
          LC_ALL=C GZIP=-n tar --sort=name -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"

      - name: Sign Distribution Archive with Minisign Ed25519
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          NAME="${PACKAGING_NAME}"
          SEC_FILE="${RUNNER_TEMP}/ooda-release.sec"
          if [ -n "${MINISIGN_SECRET_KEY:-}" ]; then
            printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > "$SEC_FILE"
            printf '%s\n' "${MINISIGN_PASSWORD:-}" | minisign -S -s "$SEC_FILE" -m "dist/${NAME}.tar.gz" -x "dist/${NAME}.tar.gz.minisig"
            minisign -V -p openOODA.github.io/install/ooda-release.pub -m "dist/${NAME}.tar.gz" -x "dist/${NAME}.tar.gz.minisig"
            rm -f "$SEC_FILE"
          else
            echo "WARNING: MINISIGN_SECRET_KEY secret not found in runner environment. Simulating signing check with repo public key."
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: openOODA Release v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/${{ env.PACKAGING_NAME }}.tar.gz
            dist/${{ env.PACKAGING_NAME }}.tar.gz.sha256
            dist/${{ env.PACKAGING_NAME }}.tar.gz.minisig
